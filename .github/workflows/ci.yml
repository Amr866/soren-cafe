name: CI Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Test & Security Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      NODE_ENV: test
      CHROME_BIN: /usr/bin/google-chrome

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Google Chrome
        uses: browser-actions/setup-chrome@latest

      - name: Install Dependencies
        run: bun install

      - name: Seed SQLite Database
        run: bun run seed

      - name: TypeScript Typecheck
        run: bun run typecheck

      - name: Bun Unit & Integration Test Suite
        run: bun run test

      - name: Zero-Trust Security & Penetration Audit
        run: bun run test:security

      - name: Observability Dashboard & Threat Simulator Verification
        run: node scripts/verify-dashboard-security.mjs

      - name: PWA & Static HTML Asset Link Audit
        run: bun run test:static

      - name: Headless Browser E2E Steppers & Upsell Test
        run: bun run test:e2e

      - name: Multi-Viewport Responsive Headless Chrome Test
        run: bun run test:responsive
